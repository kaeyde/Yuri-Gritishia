<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaeyd Sevilla</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background -->

    <div class="background-overlay"></div>

    <!-- ========================= -->
    <!-- Header -->
    <!-- ========================= -->

    <header>

        <div class="container navbar">

            <div class="brand">

                <img src="images/logo.svg" alt="Kaeyd Sevilla Logo">

                <span class="divider"></span>

                <h1>Kaeyd Sevilla</h1>

            </div>

            <nav>

                <ul>

                    <li><a class="active" href="#">Home</a></li>

                    <li><a href="#">Prices</a></li>

                    <li><a href="#">Services</a></li>

                    <li><a href="#">Reviews</a></li>

                    <li><a href="#">FAQ</a></li>

                </ul>

            </nav>

            <button id="messageButton">

                Message Us

            </button>

        </div>

    </header>





    <!-- ========================= -->
    <!-- Hero -->
    <!-- ========================= -->

    <main>

        <section class="hero">

            <div class="hero-icon">

                <img src="images/leaf.svg" alt="Leaf">

            </div>

            <div class="hero-title">

                <h2>

                    KAEYD SEVILLA

                </h2>

            </div>

            <div class="hero-description">

                <p>

                    Your trusted seller and middleman.

                </p>

                <p>

                    Safe trades. Fast service. Trusted by hundreds.

                </p>

            </div>

            <div class="hero-buttons">

                <a href="#" class="primary-btn">

                    View Services

                </a>

                <a href="#" class="secondary-btn">

                    View Items

                </a>

            </div>

        </section>





        <!-- ========================= -->
        <!-- Scroll Indicator -->
        <!-- ========================= -->

        <section class="scroll-indicator">

            <p>

                FEATURED ITEMS

            </p>

            <img src="images/divider.svg" alt="Divider">

            <a href="#featured">

                <img src="images/arrow-down.svg" alt="Scroll Down">

            </a>

        </section>

    </main>





    <!-- ========================= -->
    <!-- Featured Items -->
    <!-- ========================= -->

    <section id="featured">

    </section>





    <script src="https://client.crisp.chat/l.js"></script>

    <script src="js/script.js"></script>

</body>

</html>
